site_name: "Wiki"
site_description: EAxWiki — EA model wiki
docs_dir: wiki
theme:
  name: material
  logo: assets/eursura-logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes

use_directory_urls: false

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.betterem
  - pymdownx.highlight
  # Inline Material Design SVG icons via :material-*: shortcodes. Used for
  # 📁 (folder-outline) / 🗺️ (map-outline) glyphs on package and diagram pages,
  # so the wiki matches mkdocs-material's own icon vocabulary and looks the
  # same across OSes / themes instead of relying on OS-rendered Unicode emoji.
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - extra.css
  - brand.css

extra_javascript:
  - ea-icons.js
  - api-probe.js
  - cytoscape.min.js
  - graph-init.js
  - status-editor.js
  - notes-editor.js
  - row-notes-editor.js

plugins:
  - search
  - awesome-pages
  - glightbox

# If you want an explicit navigation order, uncomment and adjust 'nav'
# nav:
#   - Home: index.md
#   - Architecture:
#     - Overview: Architecture/index.md
